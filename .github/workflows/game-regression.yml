name: Game regression checks

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game syntax and regression tests
        run: npm run check

  browser-smoke:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Test actual desktop and touch input in Chromium
        run: node tests/browser-smoke.mjs
      - name: Preserve visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
