<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Archives of Madness</title>
<style>
/* The whole screen is the room. Every control is a paper cut-out drawn inside the room itself. */
:root{color-scheme:dark;--ink:#0d0a08;--paper:#e9dfc4;--lamp:#f2c14e}
html,body{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none}
body{color:var(--paper);font-family:ui-monospace,Menlo,Consolas,monospace}
#room{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#view{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:grab;outline:none;touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sfx{--c:#ffd34d;position:absolute;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(20px,5.2vmin,40px);letter-spacing:.05em;color:var(--c);-webkit-text-stroke:1.5px #14100e;paint-order:stroke fill;text-shadow:0 0 6px var(--c),0 0 18px var(--c),0 2px 0 #14100e;animation:pop .9s ease-out forwards;white-space:nowrap}
.sfx.red{--c:#ff8f6b}.sfx.mind{--c:#c9b3f2}
@keyframes pop{0%{transform:scale(.4) rotate(var(--r));opacity:0}15%{transform:scale(1.15) rotate(var(--r));opacity:1}70%{opacity:1}100%{transform:scale(1) rotate(var(--r)) translateY(-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sfx{animation-duration:.01s}}
</style>
<div id="room">
  <h1 class="sr">Archives of Madness</h1>
  <canvas id="view" tabindex="0" aria-label="Archives of Madness. A third-person view (V for first person) filling the screen inside a hexagonal library. Health, sanity, your face and lantern oil float at the top as glowing layered models; a layered glowing thumbstick (push up to walk, sideways to turn) and glowing 3D Journal, Read and Swing icons float at the bottom. A cinematic title screen starts the game; Enter begins and Escape skips story scenes. Keys: W A S D or arrows to move, drag to look around and up or down (or R and F), Q or 1 2 3 4 switch weapons (bookpress, shelf rod, oil flask, torch), I burns incense, M toggles sound, E reads the shelf you aim at or uses what is in front of you (the Index, the stair, a closet, the mirror), Space swings, J opens the journal."></canvas>
  <div id="fx" aria-live="polite"></div>
</div>
<div id="safe" aria-hidden="true"></div>
<script>

let W=320,H=200,PLANE=Math.tan(Math.PI/6),PROJ=(W/2)/PLANE;
let EYE=0.5;
/* The Library. Every gallery is a hexagon, after Borges: twenty shelves, five to each of four walls, thirty-two books
   to a shelf, a vast air shaft with a low railing in the middle, two spherical lamps, and two free sides with doorways,
   east and west. The galleries stand apart on a square grid, separated by open air. Railed catwalks run north-south and
   east-west between them; a short landing joins each doorway to the catwalk beside it. Where four catwalks cross is the
   communal platform: the spiral stairwell and four pillars holding the sleep closet, necessities closet, mirror and
   food hatch. Full hubs sit at regularly spaced coordinates across x, y and floor; the intermediate levels contain
   bare transit landings and continuous spiral stairs, not community facilities. Each new real sentence expands the
   equal grid interval by one horizontal room and one vertical floor. Every gallery is the same room; only its books differ, and they are calculated from the gallery's
   address, so the Library goes on without end in every direction and up and down, as large as Borges' Library and
   larger, and the same shelf always holds the same books. */
const R=5,A=R*Math.cos(Math.PI/6),HW=0.75,P=16,CWI=P/2-0.8,PLI=P/2-1.8,PIL0=PLI,PIL1=PLI+0.7,WALLH=1.9,FH=2.15,RS=1.7,RSW=0.65,RAILH=0.34,LAMPY=3.0,LAMPZ=1.3,JLZ=1.5,CATT=0.12,MZ0=0.16,MZ1=WALLH-0.1;
const MAXLV=7;
const NRM=[...Array(6)].map((_,w)=>[Math.cos(w*Math.PI/3),Math.sin(w*Math.PI/3)]);
const wrapN=(v,n)=>((v%n)+n)%n;
function torusD(a,b,n){const d=wrapN(a-b,n);return Math.min(d,n-d)}
function signedD(to,from,n){let d=wrapN(to-from,n);if(d>n/2)d-=n;return d}
const view=document.getElementById('view'),vctx=view.getContext('2d');
const scene=document.createElement('canvas');scene.width=W;scene.height=H;const sctx=scene.getContext('2d');
let img=sctx.createImageData(W,H),buf=img.data,zbuf,NR,RT,RY0,RY1,MT,MYT,MYB,LGN,LGX,LGY,LGDX,LGDY,LGT0;
/* per screen column: depth of the wall, railings and the mirror (they hide paper cards behind them), and the path of the ray */
function allocCols(){zbuf=new Float32Array(W);NR=new Uint8Array(W);RT=new Float32Array(W*4);RY0=new Float32Array(W*4);RY1=new Float32Array(W*4);
  MT=new Float32Array(W);MYT=new Float32Array(W);MYB=new Float32Array(W);LGN=new Uint8Array(W);
  LGX=new Float64Array(W*5);LGY=new Float64Array(W*5);LGDX=new Float64Array(W*5);LGDY=new Float64Array(W*5);LGT0=new Float64Array(W*5)}
allocCols();

function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function prng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

/* gallery (i,j) stands at (i*P, j*P); north is -y */
/* a gallery's address is its place on the grid: east-west, north-south */
function galId(i,j){return i+','+j}
function galInfo(g){const p=g.split(',');return{i:+p[0],j:+p[1],k:0}}
function shelfWalls(){return[1,2,4,5]}
const WN={1:1,2:2,4:3,5:4};function wallNo(k,w){return WN[w]}
function tileD(i1,j1,i2,j2){return Math.abs(i1-i2)+Math.abs(j1-j2)}
const ROOMS=new Map(),AIRS=new Map();
/* cached by column, then row: any address, and no allocation once seen */
let NCACHE=0;
function cached(M,i,j,make){let m=M.get(i);if(!m){m=new Map();M.set(i,m)}let c=m.get(j);if(!c){if(++NCACHE>20000){ROOMS.clear();AIRS.clear();NCACHE=0;m=new Map();M.set(i,m)}c=make();m.set(j,c)}return c}
function getRoom(i,j){return cached(ROOMS,i,j,()=>makeRoom(i,j))}
function makeRoom(i,j){let c;const cx=i*P,cy=j*P,id=i+','+j;
  c={kind:'g',id,i,j,k:0,gid:galId(i,j),cx,cy,doors:[0,3],lamps:[[cx,cy+LAMPY],[cx,cy-LAMPY]]};return c}
function getAir(i,j){return cached(AIRS,i,j,()=>({kind:'a',id:i+','+j,i,j,cx:i*P,cy:j*P}))}
function inHexL(lx,ly,ap){for(let w=0;w<6;w++)if(lx*NRM[w][0]+ly*NRM[w][1]>ap)return false;return true}

/* The Library's communal hubs form a REGULAR 3-D lattice, never a random floor pattern.
   Each unique real sentence widens all three hub intervals by one gallery / one floor.
   The spiral stair remains present on intervening floors, but the social facilities don't. */
function hubStride(){return 3+(G.sentencesFound||0)}
function divisibleBy(n,step){return ((n%step)+step)%step===0}
function hubFloor(fl=G.floor){return divisibleBy(fl,hubStride())}
function isStair(ci,cj){const step=hubStride();return divisibleBy(ci,step)&&divisibleBy(cj,step)}
function isComm(ci,cj,fl=G.floor){return isStair(ci,cj)&&hubFloor(fl)}
/* Four square corners may have stairs. Each staircase has a full-hub variant
   on hub floors and an empty transit-landing variant on all other floors. */
function sqMask(i,j){let m=0;for(let b=0;b<4;b++){const sx=b&1?1:-1,sy=b&2?1:-1;if(isStair(i+(sx>0?0:-1),j+(sy>0?0:-1)))m|=1<<b}return m}
function sqLayout(i,j){return sqMask(i,j)+(hubFloor()?0:16)}
function cornerStair(i,j,lx,ly){return isStair(i+(lx>0?0:-1),j+(ly>0?0:-1))}
function cornerComm(i,j,lx,ly){return cornerStair(i,j,lx,ly)&&hubFloor()}
/* the segments of one square of the grid, in coordinates centred on its gallery: the gallery's walls seen from inside,
   and everything in the open air around it - the gallery's outside, the platform pillars, the railings. A square's
   corners differ (platform or plain crossing), so there are sixteen variants */
const SQIN=[],SQV=[];
{const sg=(L,ax,ay,bx,by,type,o)=>L.push(Object.assign({ax,ay,bx,by,type,u0:0,u1:1,len:Math.hypot(bx-ax,by-ay)},o));
 const r=A/Math.cos(Math.PI/6),V=[...Array(6)].map((_,w)=>[r*Math.cos((w*60-30)*Math.PI/180),r*Math.sin((w*60-30)*Math.PI/180)]);
 const BASE=[],RAIL=[];
 for(let w=0;w<6;w++){const a=V[w],b=V[(w+1)%6];
   if(w===0||w===3){const s0=(R/2-HW)/R,s1=(R/2+HW)/R,at=s=>[a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s],p=at(s0),q=at(s1);
     for(const [L,side] of[[SQIN,'plain'],[BASE,'ext']]){sg(L,a[0],a[1],p[0],p[1],side,{u0:0,u1:s0,len:R,wall:w});sg(L,p[0],p[1],q[0],q[1],'door',{len:2*HW});sg(L,q[0],q[1],b[0],b[1],side,{u0:s1,u1:1,len:R,wall:w})}}
   else{sg(SQIN,a[0],a[1],b[0],b[1],'shelf',{wall:w,len:R});sg(BASE,a[0],a[1],b[0],b[1],'ext',{wall:w,len:R})}}
 // railings every square has: the catwalk edges beside the gallery, and the landing to each doorway
 for(const sx of[-1,1]){sg(RAIL,sx*CWI,HW,sx*CWI,PLI,'rail',{});sg(RAIL,sx*CWI,-HW,sx*CWI,-PLI,'rail',{});
   sg(RAIL,sx*A,HW,sx*CWI,HW,'rail',{});sg(RAIL,sx*A,-HW,sx*CWI,-HW,'rail',{})}
 for(const sy of[-1,1])sg(RAIL,-PLI,sy*CWI,PLI,sy*CWI,'rail',{});
 for(let mask=0;mask<32;mask++){const solid=BASE.slice(),rails=RAIL.slice(),wells=[],fullHub=mask<16;
   for(let b=0;b<4;b++){const sx=b&1?1:-1,sy=b&2?1:-1;
     if((mask&15)&(1<<b)){
       // The spiral stair goes through EVERY level, with railings around its well.
       // Only full hub floors get four pillars: sleep, privy, mirror, and food hatch.
       if(fullHub){
         const inX=(sx===1&&sy===1)?'sleep':(sx===-1&&sy===-1)?'privy':(sx===1&&sy===-1)?'mirror':'food',inY=(sx===1&&sy===-1)?'mirror':'pillar';
         const x0=sx*PIL0,x1=sx*PIL1,y0=sy*PIL0,y1=sy*PIL1;
         sg(solid,x1,y0,x1,y1,inX,{});sg(solid,x0,y1,x1,y1,inY,{});sg(solid,x0,y0,x0,y1,'pillar',{});sg(solid,x0,y0,x1,y0,'pillar',{});
       }
       sg(rails,sx*PLI,sy*PIL1,sx*PLI,sy*CWI,'rail',{});sg(rails,sx*PIL1,sy*PLI,sx*CWI,sy*PLI,'rail',{});wells.push([sx*P/2,sy*P/2]);
     }else{
       sg(rails,sx*CWI,sy*PLI,sx*CWI,sy*CWI,'rail',{});sg(rails,sx*PLI,sy*CWI,sx*CWI,sy*CWI,'rail',{});
     }}
   SQV.push({solid,rails,wells})}
}
/* is there catwalk, landing or platform floor here, and is it inside a stairwell */
function inWell(px,py){const i=Math.round(px/P),j=Math.round(py/P),lx=px-i*P,ly=py-j*P;if(!cornerStair(i,j,lx,ly))return false;const wx=Math.abs(lx)-P/2,wy=Math.abs(ly)-P/2;return wx*wx+wy*wy<RSW*RSW}
function airFloor(px,py){const i=Math.round(px/P),j=Math.round(py/P),lx=px-i*P,ly=py-j*P,ax=Math.abs(lx),ay=Math.abs(ly);
  if(ay<=HW&&ax>=A&&ax<=CWI)return true;
  if(ax>=CWI||ay>=CWI)return!inWell(px,py);
  if(ax>=PLI&&ay>=PLI&&cornerStair(i,j,lx,ly))return!inWell(px,py);
  return false}
/* where you may stand */
function walkable(x,y,rad){
  if(galleryBarricadeAt(x,y,rad))return false;
  const i=Math.round(x/P),j=Math.round(y/P),lx=x-i*P,ly=y-j*P,ax=Math.abs(lx),ay=Math.abs(ly);
  if(inHexL(lx,ly,A-rad))return lx*lx+ly*ly>=(RS+rad)*(RS+rad);
  if(ay<=HW-rad&&ax>=A-rad-0.05&&ax<=CWI+rad+0.01)return true;
  const stair=cornerStair(i,j,lx,ly),comm=stair&&hubFloor();
  if(comm&&ax>=PIL0-rad&&ax<=PIL1+rad&&ay>=PIL0-rad&&ay<=PIL1+rad)return false;
  if(stair){const wx=ax-P/2,wy=ay-P/2;if(wx*wx+wy*wy<(RSW+rad)*(RSW+rad))return false}
  return ax>=CWI+rad||ay>=CWI+rad||(stair&&ax>=PLI+rad&&ay>=PLI+rad);
}
function placeOf(x,y){const i=Math.round(x/P),j=Math.round(y/P);return inHexL(x-i*P,y-j*P,A)?getRoom(i,j):getAir(i,j)}
/* the nearest crossing of catwalks to a point, and whether it is communal */
function crossingAt(px,py){const ci=Math.round(px/P-0.5),cj=Math.round(py/P-0.5);return{ci,cj,x:(ci+0.5)*P,y:(cj+0.5)*P,comm:isComm(ci,cj),stairs:isStair(ci,cj)}}

/* RESET-EPOCH ENVIRONMENTS. Each gallery and stair crossing gets one procedural,
   mutable condition. An ordinary day never rerolls it, and opening a cache or
   breaking a barricade is remembered until the next genuine Library reset. */
const GALLERY_NAMES={
  normal:'THE ORDINARY LIBRARY',burned:'THE CINDER ARCHIVE',
  burning:'THE BURNING HEXAGON',barricaded:'THE SEALED LIBRARY',
  refuge:'THE FORGOTTEN REFUGE'
};
const CROSS_NAMES={
  plain:'THE LANDING',barricaded:'THE BARRICADED HUB',
  scorched:'THE SCORCHED HUB',vigil:'THE VIGIL HUB',
  ash:'THE ASHEN LANDING',watch:'THE WATCH LANDING',
  collapsed:'THE BROKEN LANDING',shrine:'THE PAGE SHRINE'
};
function galleryZone(i,j,fl=G.floor){
  const key=G.resetEpoch+'|g|'+i+','+j+'|'+fl;
  let z=G.zoneState.get(key);if(z)return z;
  const seed=hashStr('condition|'+key),r=prng(seed),roll=r();
  let type=roll<.60?'normal':roll<.76?'burned':roll<.85?'burning':roll<.97?'barricaded':'refuge';
  if(G.startGallery===i+','+j+':'+fl)type='normal'; // do not spawn the player inside a fire or a locked doorway
  z={key,type,seed,side:r()<.5?-1:1,opened:false,breached:false};
  G.zoneState.set(key,z);return z;
}
function crossingZone(ci,cj,fl=G.floor){
  if(!isStair(ci,cj))return null;
  const hub=isComm(ci,cj,fl);
  const key=G.resetEpoch+'|'+(hub?'hub':'transit')+'|'+ci+','+cj+'|'+fl;
  let z=G.zoneState.get(key);if(z)return z;
  const seed=hashStr('condition|'+key),r=prng(seed),v=r();
  const type=hub?(v<.58?'plain':v<.82?'barricaded':v<.93?'scorched':'vigil')
    :(v<.35?'plain':v<.55?'ash':v<.70?'barricaded':v<.85?'watch':v<.95?'collapsed':'shrine');
  z={key,type,seed,hub,opened:false,breached:false};
  G.zoneState.set(key,z);return z;
}
function standingZone(){
  if(G.inRoom&&G.room)return galleryZone(G.room.i,G.room.j);
  const c=crossingAt(G.x,G.y);
  return c.stairs?crossingZone(c.ci,c.cj):null;
}
function zoneStatus(z){
  if(!z)return'OPEN CATWALK';
  const name=typeof z.hub==='boolean'?CROSS_NAMES[z.type]:GALLERY_NAMES[z.type];
  return (name||'THE LIBRARY')+(z.breached?' · BREACHED':z.opened?' · SEARCHED':'');
}
function zoneDescription(z){
  if(!z)return'';
  if(z.hub)return({
    plain:'Brass stairs rise from four occupied corners.',
    barricaded:'The living have boarded the food hatch and chained the sleeping closet. The stair itself remains open.',
    scorched:'Charred pillars and cinders. The stair survived a violent fire.',
    vigil:'Lanterns, torn pages and wax candles ring a silent watch.'
  }[z.type]||'');
  return ({
    plain:'Bare stone above the shaft. The spiral stair is still open.',
    ash:'Ash clings to the landing. The places where the hub pillars should be are dark.',
    barricaded:'A makeshift checkpoint of planks and furniture guards the bare stair.',
    watch:'A lookout chair, warning scraps and a discarded cache watch the dark.',
    collapsed:'Part of the balustrade has fallen away; the stair continues past the gap.',
    shrine:'Names and last sentences are pinned around a candlelit offering.'
  })[z.type]||'';
}
/* Only one of a library's east/west entrances is obstructed.
   The other entrance always remains traversable. */
function galleryBarricadeAt(x,y,rad=0,fl=G.floor){
  const i=Math.round(x/P),j=Math.round(y/P),lx=x-i*P,ly=y-j*P;
  if(Math.abs(ly)>HW+.15+rad)return null;
  const z=galleryZone(i,j,fl);
  if(z.type!=='barricaded'||z.breached)return null;
  return Math.abs(lx-z.side*A)<=.23+rad?z:null;
}
function barrierTarget(){
  const i0=Math.round(G.x/P),j0=Math.round(G.y/P);
  for(let i=i0-1;i<=i0+1;i++)for(let j=j0-1;j<=j0+1;j++){
    const z=galleryZone(i,j),px=i*P+z.side*A,py=j*P,dx=px-G.x,dy=py-G.y,d=Math.hypot(dx,dy);
    if(z.type==='barricaded'&&!z.breached&&d<2.2&&Math.abs(angDiff(Math.atan2(dy,dx),G.ang))<.95)return{zone:z,x:px,y:py,dist:d};
  }
  return null;
}
function crossingFeatureTarget(){
  if(G.inRoom)return null;
  const c=crossingAt(G.x,G.y);
  if(!c.stairs)return null;
  const z=crossingZone(c.ci,c.cj);if(z.type==='plain')return null;
  // Off-center props never cover the well or block the stair.
  const px=c.x+1.36,py=c.y-.36,dx=px-G.x,dy=py-G.y,d=Math.hypot(dx,dy);
  if(d>2.05||Math.abs(angDiff(Math.atan2(dy,dx),G.ang))>.85)return null;
  return{zone:z,x:px,y:py,dist:d,crossing:c};
}
function galleryCacheTarget(){
  if(!G.inRoom)return null;
  const z=galleryZone(G.room.i,G.room.j);
  if(!['burned','refuge','barricaded'].includes(z.type)||z.opened||z.type==='barricaded'&&!z.breached)return null;
  const px=G.room.cx+2.4,py=G.room.cy+2.4,dx=px-G.x,dy=py-G.y,d=Math.hypot(dx,dy);
  if(d>1.85||Math.abs(angDiff(Math.atan2(dy,dx),G.ang))>.9)return null;
  return{zone:z,x:px,y:py,dist:d};
}
/* Archive proofs record unique decisions and salvage operations. They survive
   daybreak and full Library resets, while locations get fresh IDs per epoch. */
function collectProof(id){
  if(!G.proofKeys)G.proofKeys=new Set();
  if(G.proofKeys.has(id))return false;
  G.proofKeys.add(id);G.proofs=(G.proofs||0)+1;
  sfx('ARCHIVE PROOF '+G.proofs,'mind');return true;
}
function eventProof(e){
  return collectProof('event|'+e.enc+'|'+G.resetEpoch);
}
function zoneRead(){
  const door=barrierTarget();
  if(door){
    door.zone.breached=true;collectProof('door|'+door.zone.key);
    G.lastHit={t:door.dist};snd('clack');sfx('BARRICADE BROKEN','mind');
    openNote('THE BARRICADED DOOR','A wall of broken shelves, torn canvas and prayer-rope blocks this doorway. You pry the timbers loose. A crooked gap opens through to the catwalk.','PASSAGE OPEN · THIS STAYS OPEN UNTIL THE NEXT LIBRARY RESET');
    return true;
  }
  const cache=galleryCacheTarget();
  if(cache){
    const z=cache.zone;z.opened=true;G.lastHit={t:cache.dist};snd('pickup');
    collectProof('cache|'+z.key);
    if(z.type==='burned'){G.type+=2;sfx('+2 SCORCHED TYPE');openNote('AMONG THE CINDERS','A small iron box survived the fire beneath a shelf of ruined bindings.','+2 TYPE · SALVAGED ONCE THIS RESET')}
    else if(z.type==='refuge'){G.oil+=2;G.incense++;sfx('HIDDEN SUPPLIES','mind');openNote('THE FORGOTTEN REFUGE','Under a folded coat and a torn map, someone kept supplies for the next reader.','+2 OIL · +1 INCENSE · CACHE EMPTY UNTIL RESET')}
    else{G.type+=3;sfx('+3 TYPE');openNote('BEHIND THE BARRICADE','The last occupants hid lead letters beneath a pile of broken boards.','+3 TYPE · CACHE EMPTY UNTIL RESET')}
    return true;
  }
  const feature=crossingFeatureTarget();
  if(feature){
    const z=feature.zone;G.lastHit={t:feature.dist};snd('page');
    let award='';
    if(z.type==='barricaded'&&!z.breached){z.breached=true;z.inspected=true;G.type+=1;award='BARRICADE CLEARED · +1 TYPE'}
    else if(!z.opened&&(z.type==='watch'||z.type==='shrine'||z.type==='vigil')){
      z.opened=true;
      if(z.type==='watch'){G.oil+=2;award='+2 OIL · LOOKOUT CACHE EMPTIED'}
      else{G.incense++;award='+1 INCENSE · OFFERING TAKEN'}
    }
    else if(!z.opened&&z.type==='ash'){z.opened=true;G.type++;award='+1 CHARRED TYPE'}
    else if(!z.inspected){z.inspected=true}
    else return false; // let the regular Read action open the still-usable stairs

  out.push({type:'zone',x,y,hgt:height,cards:Array.isArray(card)?card:[card],
    frame:options.frame||0,z0:options.z0||0,bill:true,f:0,dead:0,

}
function galleryDressing(out,i,j){
  const zone=galleryZone(i,j),x=i*P,y=j*P;

  const v=G.time,seed=zone.seed;
  const spots=[
    [x+Math.cos(.85)*2.85,y+Math.sin(.85)*2.85],

    [x+Math.cos(5.40)*2.85,y+Math.sin(5.40)*2.85]

    for(let k=0;k<3;k++)zoneSprite(out,ZSPR.ruin,spots[k][0],spots[k][1],.92+(k%2)*.25,{sh:true});
    zoneSprite(out,ZSPR.ash,x-2.15,y+2.2,.30,{sh:false});

/* book walls are numbered 1 to 4 for the reader in every gallery; the two free sides have no shelves.
   Your page is not scattered by chance: it lives near one gallery and floor tied to your phrase, and favours two walls.
   The closer you are (tiles across the honeycomb, plus floors up or down), the denser it gets. */
const BIO={};
function bioPlan(phrase){const P0=BIO[phrase];if(P0)return P0;const r=prng(hashStr('bio|'+phrase)),a=Math.floor(r()*4),b=(a+1+Math.floor(r()*3))%4;
  const Q={walls:[a+1,b+1],i:Math.floor((r()-0.5)*200000),j:Math.floor((r()-0.5)*200000),k:0,f:Math.floor((r()-0.5)*2000)};Q.g=galId(Q.i,Q.j);
  Q.wall=Q.walls[Math.floor(r()*2)];Q.shelf=1+Math.floor(r()*5);Q.book=1+Math.floor(r()*32);return BIO[phrase]=Q}
function bioDist(g,f,phrase){const P=bioPlan(phrase),q=galInfo(g);return tileD(q.i,q.j,P.i,P.j)+Math.abs(f-P.f)}
function isMyBook(g,f,wall,shelf,book,phrase){const P=bioPlan(phrase);return g===P.g&&f===P.f&&wallNo(galInfo(g).k,wall)===P.wall&&shelf===P.shelf&&book===P.book}
/* A harder Archive requires a longer investigation, not just stronger foes:
   later Index hearings, more distinct true sentences, proof from different

const QSTEPS=[

function questLines(){const P=bioPlan(G.phrase),out=[],d=P.f-G.floor,r=difficultyRules(G.difficulty);
  if(G.q>=1)out.push('Floor '+P.f+' ('+(d===0?'this floor':Math.abs(d)+(d>0?' up':' down'))+')');
  if(G.q>=2)out.push('Hexagon '+P.g+(P.g===G.gal&&d===0?' (you are in it)':' (on the map)'));
  if(G.q>=3)out.push('Wall '+P.wall+(G.q>=4?' · shelf '+P.shelf:''));
  if(G.q>=5)out.push('Book '+P.book+', page 1');
  if(G.q>=6)out.push('It is on the shelf now.');
  else{const s=QSTEPS[G.q];out.push('NEXT · '+(G.q===1?'Bring '+r.indexCost+' fragments and discover '+r.sentences+' distinct sentences on day '+r.indexDay+' or later.':G.q===3?'Buy the shelf-mark slip from day '+r.shelfDay+'.':G.q===5?'Return at dawn on day '+r.minDay+' or later, with '+r.sentences+' distinct sentences and '+r.proofs+' archive proofs.':s.how))}
  if(G.q<6)out.push('ARCHIVE · '+r.name+' · true sentences '+(G.sentencesFound||0)+'/'+r.sentences+' · proofs '+(G.proofs||0)+'/'+r.proofs+' · earliest day '+r.minDay);

function makePage(g,f,wall,shelf,book,page,phrase){
  const key=g+'.'+f+'|'+wall+'|'+shelf+'|'+book+'|'+page,h=hashStr(key),rnd=prng(h);
  const chars=new Array(3200);for(let i=0;i<3200;i++)chars[i]=ALPHA[Math.floor(rnd()*ALPHA.length)];
  let kind='noise',insert=null;
  if(G.q>=6&&page===1&&isMyBook(g,f,wall,shelf,book,phrase)){kind='phrase';insert=phrase}else if(h%19===0){kind='sentence';insert=SENTENCES[h%SENTENCES.length]}
  let at=-1;
  if(insert){at=Math.floor(rnd()*(3200-insert.length));for(let i=0;i<insert.length;i++)chars[at+i]=insert[i]}
  return{chars,kind,at,len:insert?insert.length:0,key};
}

    if(!e.lootId||G.looted.has(e.lootId))return;
    if(!((e.type==='pur'||e.type==='seek')&&e.dead>0||(e.type==='fig'&&e.pose==='dead')))return;
    if(e.lvl!==undefined&&e.lvl!==0)return;
    const dx=e.x-G.x,dy=e.y-G.y,d=Math.hypot(dx,dy);
    if(d>closest||d<0.05)return;

    else if(c==='ArrowDown'||c==='KeyS')action('down');
    else if(c==='ArrowLeft'||c==='KeyA')action('prev');
    else if(c==='ArrowRight'||c==='KeyD')action('next');
    else if(c==='Enter'||c==='Space'||c==='KeyE')action('read');
    else if(c==='Escape')action('back');
    else if(c==='KeyM')soundToggle();
    ev.preventDefault();return;
  }
  if(G.state==='cinematic'){
    if(ev.repeat){ev.preventDefault();return}
    if(c==='Escape'||c==='KeyX')action('skip');
    else if(c==='Enter'||c==='Space'||c==='KeyE'||c==='ArrowRight')action('next');
    ev.preventDefault();return;
  }
  if(G.state==='book'){
    if(G.choice==='enc'&&(c==='Digit1'||c==='Numpad1'||c==='Digit2'||c==='Numpad2')){
      if(!ev.repeat)action((c==='Digit1'||c==='Numpad1')?'up':'down');
      ev.preventDefault();return;
    }
    if(c==='ArrowRight'||c==='KeyD'){action('next');ev.preventDefault()}
    else if(c==='ArrowLeft'||c==='KeyA'){action('prev');ev.preventDefault()}
    else if(c==='ArrowUp'||c==='KeyW'){action('up');ev.preventDefault()}
    else if(c==='ArrowDown'||c==='KeyS'){action('down');ev.preventDefault()}
    else if((c==='Enter'||c==='Space')&&G.choice==='hatch'){action('buy');ev.preventDefault()}
    else if(c==='KeyE'||c==='Escape'||c==='Enter'||c==='Space'){action('close');ev.preventDefault()}
    return;
  }
  if(KEYMAP[c]&&G.state==='play'){keys[KEYMAP[c]]=true;ev.preventDefault()}
  if(c==='Space'){action('swing');ev.preventDefault()}
  if(c==='KeyE'||c==='Enter'){action('read');ev.preventDefault()}
  if(c==='KeyJ'||c==='Tab'){action('journal');ev.preventDefault()}
  if(G.state==='play'){if(c==='KeyQ')cycleWeapon();else if(c==='Digit1')setWeapon('press');else if(c==='Digit2')setWeapon('rod');else if(c==='Digit3')setWeapon('oil');else if(c==='Digit4')setWeapon('torch');else if(c==='KeyI')useIncense()}
  if(c==='KeyM')soundToggle();
  if(c==='KeyV')toggleView();
});
addEventListener('keyup',ev=>{if(KEYMAP[ev.code])keys[KEYMAP[ev.code]]=false});
function releaseAll(){for(const k in keys)keys[k]=false;for(const k in CTLS)CTLS[k].held=0;ptrs.clear();releaseStick()}
addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
/* touch and mouse: buttons are hit-tested where they float this frame; anywhere else drags to look */
const ptrs=new Map();
function canvasPt(ev){const r=view.getBoundingClientRect();return{x:(ev.clientX-r.left)*DW/r.width,y:(ev.clientY-r.top)*DH/r.height}}
function holdCtl(k,id){const c=CTLS[k];c.held++;if(c.dpad)keys[k]=true;else action(k);ptrs.set(id,{kind:'ctl',key:k})}
function letGo(k){const c=CTLS[k];c.held=Math.max(0,c.held-1);if(c.dpad&&c.held===0)keys[k]=false}
view.addEventListener('pointerdown',ev=>{
  ev.preventDefault();try{view.focus({preventScroll:true})}catch(e){}
  try{view.setPointerCapture(ev.pointerId)}catch(e){}
  const pt=canvasPt(ev);
  if(G.state==='play'&&ctlA>0.5){const k=hitCtl(pt.x,pt.y);if(k){holdCtl(k,ev.pointerId);return}if(STICK.id==null&&inStickZone(pt.x,pt.y)){grabStick(ev.pointerId,pt);return}
    // tap your weapon hand to switch weapons, tap your face in the mirror to burn incense
    const hc=LAY.hands.c;if(pt.x>=LAY.hands.pressX-hc&&pt.x<=LAY.hands.pressX+11*hc&&pt.y>=DH-10*hc){cycleWeapon();return}
    const fr=HUD[1].rect;if(fr&&pt.x>=fr.x0&&pt.x<=fr.x1&&pt.y>=fr.y0&&pt.y<=fr.y1){useIncense();return}}
  const startChoice=G.state==='book'&&G.choice==='enc'?eventChoiceAtScreen(pt.x,pt.y):-1;
  ptrs.set(ev.pointerId,{kind:'look',x:ev.clientX,y:ev.clientY,sx:ev.clientX,sy:ev.clientY,t:performance.now(),startChoice});
});
view.addEventListener('pointermove',ev=>{
  const p=ptrs.get(ev.pointerId);
  if(!p){if(ev.pointerType==='mouse'){
    const pt=canvasPt(ev),choice=G.state==='book'&&G.choice==='enc'?eventChoiceAtScreen(pt.x,pt.y):-1;
    eventHover(choice);
    view.style.cursor=choice>=0?'pointer':(G.state==='play'&&(hitCtl(pt.x,pt.y)||inStickZone(pt.x,pt.y)))?'pointer':'grab';
  }return}
  if(p.kind==='stick'){const pt=canvasPt(ev);stickSet(pt.x,pt.y);return}
  if(p.kind==='ctl')return;
  if(G.state==='play'){const fov=2*Math.atan(PLANE);G.ang+=(ev.clientX-p.x)/CW*fov*(FINE?2.4:1.8);G.pitch=Math.max(-0.45,Math.min(0.45,G.pitch-(ev.clientY-p.y)/CH*(FINE?1.2:0.9)))}
  if(G.state==='book'&&G.choice==='enc'&&ev.pointerType==='mouse'){const pt=canvasPt(ev);eventHover(eventChoiceAtScreen(pt.x,pt.y))}
  p.x=ev.clientX;p.y=ev.clientY;
});
function endPtr(ev,cancel){
  const p=ptrs.get(ev.pointerId);if(!p)return;ptrs.delete(ev.pointerId);
  if(p.kind==='ctl'){letGo(p.key);return}
  if(p.kind==='stick'){releaseStick();return}
  if(cancel||Math.hypot(ev.clientX-p.sx,ev.clientY-p.sy)>10||performance.now()-p.t>500)return;
  if(G.state==='title'){
    const pt=canvasPt(ev),button=filmHit(pt.x,pt.y);
    if(button)action(button);
    else if(FILM.help)action('back');
  }
  else if(G.state==='cinematic'){
    const pt=canvasPt(ev);action(filmHit(pt.x,pt.y,'skip')==='skip'?'skip':'next');
  }
  else if(G.state==='intro'||G.state==='dead'||G.state==='won')action('read');
  else if(G.state==='play'&&G.journal&&jr.rect){const pt=canvasPt(ev),r=jr.rect;if(pt.x>=r.x0&&pt.x<=r.x1&&pt.y>=r.y0&&pt.y<=r.y1)soundToggle()}
  else if(G.state==='book'){const r=bookCard.rect,pt=canvasPt(ev);
    if(r&&pt.x>=r.x0&&pt.x<=r.x1&&pt.y>=r.y0&&pt.y<=r.y1){const fx=(pt.x-r.x0)/(r.x1-r.x0),fy=(pt.y-r.y0)/(r.y1-r.y0);if(G.choice==='hatch'){const tx=fx*TX.book.w,ty=fy*TX.book.h,i=HUI.rows.findIndex(q=>tx>=q[0]&&tx<=q[2]&&ty>=q[1]&&ty<=q[3]),B=HUI.buy;
      if(i>=0){G.hsel=i;snd('page');drawBook()}else if(B&&tx>=B[0]&&tx<=B[2]&&ty>=B[1]&&ty<=B[3])action('buy');else action('close')}
    else if(G.choice==='enc'){const picked=eventChoiceAt(fx*TX.book.w,fy*TX.book.h);
      // Only a press-and-release on the same option can commit a decision.
      // Sliding a finger over the other row or tapping in the gutter is safe.
      if(picked>=0&&picked===p.startChoice){eventHover(-1);action(picked===0?'up':'down')}
    }
    else if(G.choice)action((PORT?fy:fx)<0.5?'up':'down');else if(G.page&&fx>=0.3&&fx<=0.7&&(fy<0.1||fy>0.9))action(fy<0.1?'up':'down');else action(fx<0.3?'prev':fx>0.7?'next':'close')}else action('close')}
}
view.addEventListener('pointerup',ev=>endPtr(ev,false));
view.addEventListener('pointercancel',ev=>endPtr(ev,true));
view.addEventListener('lostpointercapture',ev=>{const k=ptrs.get(ev.pointerId)?.kind;if(k==='ctl'||k==='stick')endPtr(ev,true)});
room.addEventListener('contextmenu',ev=>ev.preventDefault());
/* size everything to the screen: scene pixels, field of view, canvas, cards and the floating layout */
function resize(){
  const r=room.getBoundingClientRect();CW=Math.max(1,r.width);CH=Math.max(1,r.height);ASPECT=CW/CH;
  H=Math.max(120,Math.round(Math.sqrt((FINE?192000:112000)/ASPECT)/2)*2);W=Math.max(80,Math.round(H*ASPECT/2)*2);
  PLANE=Math.min(Math.tan(37.5*Math.PI/180),Math.max(Math.tan(27*Math.PI/180),0.3608*ASPECT));PROJ=(W/2)/PLANE;
  scene.width=W;scene.height=H;img=sctx.createImageData(W,H);buf=img.data;allocCols();for(let i=3;i<buf.length;i+=4)buf[i]=255;
  let s=Math.min(2,window.devicePixelRatio||1);const lg=Math.max(CW,CH)*s;if(lg>2400)s*=2400/lg;
  DW=Math.max(2,Math.round(CW*s));DH=Math.max(2,Math.round(CH*s));view.width=DW;view.height=DH;SX=DW/W;SY=DH/H;
  SCENEVIGNETTE=vctx.createRadialGradient(DW*0.5,DH*0.46,Math.min(DW,DH)*0.25,DW*0.5,DH*0.46,Math.hypot(DW,DH)*0.57);
  SCENEVIGNETTE.addColorStop(0,'rgba(16,12,21,0)');SCENEVIGNETTE.addColorStop(1,'rgba(16,12,21,0.22)');
  const cs=getComputedStyle(safeEl);INS={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  const port=ASPECT<1;if(port!==PORT||!TX.book){PORT=port;cardTex();drawIntro();drawDead();drawWon();drawJournal();drawBook()}
  LAY=layout();
  FILM.backdrop=null; // re-render the paper theatre at the new screen size
}
if(window.ResizeObserver)new ResizeObserver(()=>{needResize=true}).observe(room);
addEventListener('resize',()=>{needResize=true});
reset();G.state='title';FILM.selection=0;FILM.help=false;
resize();MOT.ang=G.ang;MOT.x=G.x;MOT.y=G.y;requestAnimationFrame(frame);
</script>
