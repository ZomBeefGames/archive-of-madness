<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Archives of Madness</title>
<style>
/* The whole screen is the room. Every control is a paper cut-out drawn inside the room itself. */
:root{color-scheme:dark;--ink:#0d0a08;--paper:#e9dfc4;--lamp:#f2c14e}
html,body{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none}
body{color:var(--paper);font-family:ui-monospace,Menlo,Consolas,monospace}
#room{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#view{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:grab;outline:none;touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sfx{--c:#ffd34d;position:absolute;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(20px,5.2vmin,40px);letter-spacing:.05em;color:var(--c);-webkit-text-stroke:1.5px #14100e;paint-order:stroke fill;text-shadow:0 0 6px var(--c),0 0 18px var(--c),0 2px 0 #14100e;animation:pop .9s ease-out forwards;white-space:nowrap}

@keyframes pop{0%{transform:scale(.4) rotate(var(--r));opacity:0}15%{transform:scale(1.15) rotate(var(--r));opacity:1}70%{opacity:1}100%{transform:scale(1) rotate(var(--r)) translateY(-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sfx{animation-duration:.01s}}
</style>
<div id="room">
  <h1 class="sr">Archives of Madness</h1>
  <canvas id="view" tabindex="0" aria-label="Archives of Madness. A third-person view (V for first person) filling the screen inside a hexagonal library. Health, sanity, your face and lantern oil float at the top as glowing layered models; a layered glowing thumbstick (push up to walk, sideways to turn) and glowing 3D Journal, Read and Swing icons float at the bottom. Keys: W A S D or arrows to move, drag to look around and up or down (or R and F), Q or 1 2 3 switch weapons (bookpress, shelf rod, oil flask), I burns incense, M toggles sound, E reads the shelf you aim at or uses what is in front of you (the Index, the stair, a closet, the mirror), Space swings, J opens the journal."></canvas>
  <div id="fx" aria-live="polite"></div>
</div>
<div id="safe" aria-hidden="true"></div>
<script>

let W=320,H=200,PLANE=Math.tan(Math.PI/6),PROJ=(W/2)/PLANE;
let EYE=0.5;
/* The Library. Every gallery is a hexagon, after Borges: twenty shelves, five to each of four walls, thirty-two books
   to a shelf, a vast air shaft with a low railing in the middle, two spherical lamps, and two free sides with doorways,
   east and west. The galleries stand apart on a square grid, separated by open air. Railed catwalks run north-south and
   east-west between them; a short landing joins each doorway to the catwalk beside it. Where four catwalks cross is the
   communal platform: the spiral stairwell in the middle under a hanging lamp, and four stone pillars at its corners that
   rise through every floor - one holds the closet for sleeping standing up, one the closet for necessities, one carries
   the mirror. Every floor has the same plan, so from a catwalk you look down and up past the catwalks and galleries of
   every other floor. Every gallery is the same room; only its books differ, and they are calculated from the gallery's
   address, so the Library goes on without end in every direction and up and down, as large as Borges' Library and
   larger, and the same shelf always holds the same books. */
const R=5,A=R*Math.cos(Math.PI/6),HW=0.75,P=16,CWI=P/2-0.8,PLI=P/2-1.8,PIL0=PLI,PIL1=PLI+0.7,WALLH=1.9,FH=2.15,RS=1.7,RSW=0.65,RAILH=0.34,LAMPY=3.0,LAMPZ=1.3,JLZ=1.5,CATT=0.12,MZ0=0.16,MZ1=WALLH-0.1;
const MAXLV=7;
const NRM=[...Array(6)].map((_,w)=>[Math.cos(w*Math.PI/3),Math.sin(w*Math.PI/3)]);
const wrapN=(v,n)=>((v%n)+n)%n;

const view=document.getElementById('view'),vctx=view.getContext('2d');
const scene=document.createElement('canvas');scene.width=W;scene.height=H;const sctx=scene.getContext('2d');
let img=sctx.createImageData(W,H),buf=img.data,zbuf,NR,RT,RY0,RY1,MT,MYT,MYB,LGN,LGX,LGY,LGDX,LGDY,LGT0;
/* per screen column: depth of the wall, railings and the mirror (they hide paper cards behind them), and the path of the ray */
function allocCols(){zbuf=new Float32Array(W);NR=new Uint8Array(W);RT=new Float32Array(W*4);RY0=new Float32Array(W*4);RY1=new Float32Array(W*4);
  MT=new Float32Array(W);MYT=new Float32Array(W);MYB=new Float32Array(W);LGN=new Uint8Array(W);
  LGX=new Float64Array(W*5);LGY=new Float64Array(W*5);LGDX=new Float64Array(W*5);LGDY=new Float64Array(W*5);LGT0=new Float64Array(W*5)}
allocCols();

function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}

/* gallery (i,j) stands at (i*P, j*P); north is -y */
/* a gallery's address is its place on the grid: east-west, north-south */
function galId(i,j){return i+','+j}
function galInfo(g){const p=g.split(',');return{i:+p[0],j:+p[1],k:0}}
function shelfWalls(){return[1,2,4,5]}
const WN={1:1,2:2,4:3,5:4};function wallNo(k,w){return WN[w]}
function tileD(i1,j1,i2,j2){return Math.abs(i1-i2)+Math.abs(j1-j2)}

function makeRoom(i,j){let c;const cx=i*P,cy=j*P,id=i+','+j;
  c={kind:'g',id,i,j,k:0,gid:galId(i,j),cx,cy,doors:[0,3],lamps:[[cx,cy+LAMPY],[cx,cy-LAMPY]]};return c}
function getAir(i,j){return cached(AIRS,i,j,()=>({kind:'a',id:i+','+j,i,j,cx:i*P,cy:j*P}))}
function inHexL(lx,ly,ap){for(let w=0;w<6;w++)if(lx*NRM[w][0]+ly*NRM[w][1]>ap)return false;return true}

/* crossings of the catwalks sit between four galleries; every third crossing each way is a communal platform, so
   between two communal platforms there are always three galleries, north, south, east and west */
const mod3=n=>((n%3)+3)%3;

/* which corners of square (i,j) touch a communal platform: bit 0 east, bit 1 south */
function sqMask(i,j){let m=0;for(let b=0;b<4;b++){const sx=b&1?1:-1,sy=b&2?1:-1;if(isComm(i+(sx>0?0:-1),j+(sy>0?0:-1)))m|=1<<b}return m}

/* the segments of one square of the grid, in coordinates centred on its gallery: the gallery's walls seen from inside,
   and everything in the open air around it - the gallery's outside, the platform pillars, the railings. A square's
   corners differ (platform or plain crossing), so there are sixteen variants */
const SQIN=[],SQV=[];
{const sg=(L,ax,ay,bx,by,type,o)=>L.push(Object.assign({ax,ay,bx,by,type,u0:0,u1:1,len:Math.hypot(bx-ax,by-ay)},o));
 const r=A/Math.cos(Math.PI/6),V=[...Array(6)].map((_,w)=>[r*Math.cos((w*60-30)*Math.PI/180),r*Math.sin((w*60-30)*Math.PI/180)]);
 const BASE=[],RAIL=[];
 for(let w=0;w<6;w++){const a=V[w],b=V[(w+1)%6];
   if(w===0||w===3){const s0=(R/2-HW)/R,s1=(R/2+HW)/R,at=s=>[a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s],p=at(s0),q=at(s1);
     for(const [L,side] of[[SQIN,'plain'],[BASE,'ext']]){sg(L,a[0],a[1],p[0],p[1],side,{u0:0,u1:s0,len:R,wall:w});sg(L,p[0],p[1],q[0],q[1],'door',{len:2*HW});sg(L,q[0],q[1],b[0],b[1],side,{u0:s1,u1:1,len:R,wall:w})}}
   else{sg(SQIN,a[0],a[1],b[0],b[1],'shelf',{wall:w,len:R});sg(BASE,a[0],a[1],b[0],b[1],'ext',{wall:w,len:R})}}

 for(const sx of[-1,1]){sg(RAIL,sx*CWI,HW,sx*CWI,PLI,'rail',{});sg(RAIL,sx*CWI,-HW,sx*CWI,-PLI,'rail',{});
   sg(RAIL,sx*A,HW,sx*CWI,HW,'rail',{});sg(RAIL,sx*A,-HW,sx*CWI,-HW,'rail',{})}

   for(let b=0;b<4;b++){const sx=b&1?1:-1,sy=b&2?1:-1;
     if(mask&(1<<b)){
       // a corner of a communal platform: a stone pillar (closets, mirror, the food hatch), the stairwell, short railings
       const inX=(sx===1&&sy===1)?'sleep':(sx===-1&&sy===-1)?'privy':(sx===1&&sy===-1)?'mirror':'food',inY=(sx===1&&sy===-1)?'mirror':'pillar';
       const x0=sx*PIL0,x1=sx*PIL1,y0=sy*PIL0,y1=sy*PIL1;
       sg(solid,x1,y0,x1,y1,inX,{});sg(solid,x0,y1,x1,y1,inY,{});sg(solid,x0,y0,x0,y1,'pillar',{});sg(solid,x0,y0,x1,y0,'pillar',{});
       sg(rails,sx*PLI,sy*PIL1,sx*PLI,sy*CWI,'rail',{});sg(rails,sx*PIL1,sy*PLI,sx*CWI,sy*PLI,'rail',{});wells.push([sx*P/2,sy*P/2]);
     }else{
       // a plain crossing of two catwalks: their railings run on to the corner
       sg(rails,sx*CWI,sy*PLI,sx*CWI,sy*CWI,'rail',{});sg(rails,sx*PLI,sy*CWI,sx*CWI,sy*CWI,'rail',{});
     }}

}
/* is there catwalk, landing or platform floor here, and is it inside a stairwell */
function inWell(px,py){const i=Math.round(px/P),j=Math.round(py/P),lx=px-i*P,ly=py-j*P;if(!cornerComm(i,j,lx,ly))return false;const wx=Math.abs(lx)-P/2,wy=Math.abs(ly)-P/2;return wx*wx+wy*wy<RSW*RSW}

  if(ay<=HW&&ax>=A&&ax<=CWI)return true;

  if(ax>=PLI&&ay>=PLI&&cornerComm(i,j,lx,ly))return!inWell(px,py);
  return false}
/* where you may stand */
function walkable(x,y,rad){
  const i=Math.round(x/P),j=Math.round(y/P),lx=x-i*P,ly=y-j*P,ax=Math.abs(lx),ay=Math.abs(ly);
  if(inHexL(lx,ly,A-rad))return lx*lx+ly*ly>=(RS+rad)*(RS+rad);

  const comm=cornerComm(i,j,lx,ly);
  if(comm){if(ax>=PIL0-rad&&ax<=PIL1+rad&&ay>=PIL0-rad&&ay<=PIL1+rad)return false;
    const wx=ax-P/2,wy=ay-P/2;if(wx*wx+wy*wy<(RSW+rad)*(RSW+rad))return false}

}
function placeOf(x,y){const i=Math.round(x/P),j=Math.round(y/P);return inHexL(x-i*P,y-j*P,A)?getRoom(i,j):getAir(i,j)}
/* the nearest crossing of catwalks to a point, and whether it is communal */
function crossingAt(px,py){const ci=Math.round(px/P-0.5),cj=Math.round(py/P-0.5);return{ci,cj,x:(ci+0.5)*P,y:(cj+0.5)*P,comm:isComm(ci,cj)}}

/* cast one ray across the grid, square by square, in and out of galleries through their doorways. It bounces off the
   mirror, notes every railing and every stretch of gallery or open air it passes, and stops on the first solid surface */
const LEG={n:0,ox:new Float64Array(5),oy:new Float64Array(5),dx:new Float64Array(5),dy:new Float64Array(5),t0:new Float64Array(6)};
const RH={n:0,t:new Float64Array(48),a:new Float64Array(48),far:new Uint8Array(48),well:new Uint8Array(48),kind:new Uint8Array(48)},MH={n:0,t:new Float64Array(4)};

const HIT={t:0,type:'',seg:null,cell:null,u:0,x:0,y:0};
function rh(t,a,far,well,kind){if(RH.n<46){RH.t[RH.n]=t;RH.a[RH.n]=a;RH.far[RH.n]=far;RH.kind[RH.n]=kind;RH.well[RH.n++]=well}}
function circ(lx,ly,dx,dy,cx,cy,r,lim,t0,well){const qx=lx-cx,qy=ly-cy,a=dx*dx+dy*dy,b=qx*dx+qy*dy,c=qx*qx+qy*qy-r*r,disc=b*b-a*c;if(disc<=0)return;
  const sq=Math.sqrt(disc),t1=(-b-sq)/a,t2=(-b+sq)/a;if(t1>1e-5&&t1<lim)rh(t0+t1,Math.atan2(qy+dy*t1,qx+dx*t1),0,well,well?2:0);if(t2>1e-5&&t2<lim)rh(t0+t2,Math.atan2(qy+dy*t2,qx+dx*t2),1,well,well?2:0)}

  let si=Math.round(ox/P),sj=Math.round(oy/P),inR=G.inRoom,px=ox,py=oy,t0=0,res=null;

    const lx=px-si*P,ly=py-sj*P,VQ=inR?null:SQV[sqMask(si,sj)],sg=inR?SQIN:VQ.solid;let best=1e9,bs=null,bk=0;
    for(let i=0;i<sg.length;i++){const s=sg[i],ex=s.bx-s.ax,ey=s.by-s.ay,den=dx*ey-dy*ex;if(den>-1e-12&&den<1e-12)continue;
      const wx=s.ax-lx,wy=s.ay-ly,t=(wx*ey-wy*ex)/den;if(t<=1e-5||t>=best)continue;const q=(wx*dy-wy*dx)/den;if(q<0||q>1)continue;best=t;bs=s;bk=q}

    if(inR)circ(lx,ly,dx,dy,0,0,RS,lim,t0,0);
    else{const RL=VQ.rails;for(let ri=0;ri<RL.length;ri++){const s=RL[ri],ex=s.bx-s.ax,ey=s.by-s.ay,den=dx*ey-dy*ex;if(den>-1e-12&&den<1e-12)continue;const wx=s.ax-lx,wy=s.ay-ly,t=(wx*ey-wy*ex)/den;if(t<=1e-5||t>=lim)continue;const q=(wx*dy-wy*dx)/den;if(q<0||q>1)continue;rh(t0+t,q*s.len*0.33,0,0,1)}

    if(TV.n<200){TV.c[TV.n]=inR?getRoom(si,sj):getAir(si,sj);TV.t1[TV.n]=t0+lim;TV.door[TV.n++]=bs&&bs.type==='door'&&best<=tp?1:0}
    if(tp<best){t0+=tp;px+=dx*tp;py+=dy*tp;if(ax)sj+=dy>0?1:-1;else si+=dx>0?1:-1;if(t0>140)break;continue}

let PX_=0,PY_=0;
function pointAt(t){let j=0;while(j+1<LEG.n&&t>=LEG.t0[j+1])j++;const q=t-LEG.t0[j];PX_=LEG.ox[j]+LEG.dx[j]*q;PY_=LEG.oy[j]+LEG.dy[j]*q}
const IVA=new Float64Array(64),IVB=new Float64Array(64);let IVN=0;
function onWalk(t){for(let k=0;k<IVN;k++)if(t>=IVA[k]&&t<=IVB[k])return true;return false}
function walkways(){
  let st=false,from=0,q=0;IVN=0;const close=t=>{if(IVN<64){IVA[IVN]=from;IVB[IVN++]=t}};
  for(let r=0;r<TV.n;r++){const ts=r?TV.t1[r-1]:0,te=TV.t1[r];
    if(TV.c[r].kind!=='a'){if(st)close(ts);st=false;while(q<RH.n&&RH.t[q]<=te)q++;continue}
    if(r===0){st=airFloor(G.x,G.y);from=0}else if(TV.c[r-1].kind!=='a'){st=true;from=ts}
    while(q<RH.n&&RH.t[q]<=te){if(RH.kind[q]){if(st)close(RH.t[q]);else from=RH.t[q];st=!st}q++}}

function cellAt(t){for(let r=0;r<TV.n;r++)if(t<=TV.t1[r])return TV.c[r];return TV.n?TV.c[TV.n-1]:null}

/* textures: a bookcase of five shelves of thirty-two books per wall, generated from the wall's coordinates so the same
   wall always looks the same; a burned variant; oak panels, the two closet doors, the stairwell, floor and ceiling */
function texCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c.getContext('2d')}
const BOOKC=['#7a2a26','#2f5d6e','#b08a3e','#4b6b3a','#6a3458','#8c5a2b','#3e4a6e','#5d2f22'];
const BURNC=['#2b2420','#3a2c24','#241d19','#4a3326','#1d1714'];
function makeCaseTex(g,f,wall,burnt){
  const w=texCanvas(128,128),rnd=prng(hashStr('case|'+g+'.'+f+'|'+wall)),cols=burnt?BURNC:BOOKC;
  w.fillStyle=burnt?'#151210':'#211b19';w.fillRect(0,0,128,128);
  for(let sh=0;sh<5;sh++){const top=8+sh*24;

    if(r&&pt.x>=r.x0&&pt.x<=r.x1&&pt.y>=r.y0&&pt.y<=r.y1){const fx=(pt.x-r.x0)/(r.x1-r.x0),fy=(pt.y-r.y0)/(r.y1-r.y0);if(G.choice==='hatch'){const tx=fx*TX.book.w,ty=fy*TX.book.h,i=HUI.rows.findIndex(q=>tx>=q[0]&&tx<=q[2]&&ty>=q[1]&&ty<=q[3]),B=HUI.buy;
      if(i>=0){G.hsel=i;snd('page');drawBook()}else if(B&&tx>=B[0]&&tx<=B[2]&&ty>=B[1]&&ty<=B[3])action('buy');else action('close')}
    else if(G.choice)action((PORT?fy:fx)<0.5?'up':'down');else if(G.page&&fx>=0.3&&fx<=0.7&&(fy<0.1||fy>0.9))action(fy<0.1?'up':'down');else action(fx<0.3?'prev':fx>0.7?'next':'close')}else action('close')}
}

view.addEventListener('pointercancel',ev=>endPtr(ev,true));

/* size everything to the screen: scene pixels, field of view, canvas, cards and the floating layout */
function resize(){
  const r=room.getBoundingClientRect();CW=Math.max(1,r.width);CH=Math.max(1,r.height);ASPECT=CW/CH;
  H=Math.max(120,Math.round(Math.sqrt((FINE?192000:112000)/ASPECT)/2)*2);W=Math.max(80,Math.round(H*ASPECT/2)*2);
  PLANE=Math.min(Math.tan(37.5*Math.PI/180),Math.max(Math.tan(27*Math.PI/180),0.3608*ASPECT));PROJ=(W/2)/PLANE;
  scene.width=W;scene.height=H;img=sctx.createImageData(W,H);buf=img.data;allocCols();for(let i=3;i<buf.length;i+=4)buf[i]=255;
  let s=Math.min(2,window.devicePixelRatio||1);const lg=Math.max(CW,CH)*s;if(lg>2400)s*=2400/lg;
  DW=Math.max(2,Math.round(CW*s));DH=Math.max(2,Math.round(CH*s));view.width=DW;view.height=DH;SX=DW/W;SY=DH/H;
  SCENEVIGNETTE=vctx.createRadialGradient(DW*0.5,DH*0.46,Math.min(DW,DH)*0.25,DW*0.5,DH*0.46,Math.hypot(DW,DH)*0.57);
  SCENEVIGNETTE.addColorStop(0,'rgba(16,12,21,0)');SCENEVIGNETTE.addColorStop(1,'rgba(16,12,21,0.22)');
  const cs=getComputedStyle(safeEl);INS={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  const port=ASPECT<1;if(port!==PORT||!TX.book){PORT=port;cardTex();drawIntro();drawDead();drawWon();drawJournal();drawBook()}
  LAY=layout();
}
if(window.ResizeObserver)new ResizeObserver(()=>{needResize=true}).observe(room);
addEventListener('resize',()=>{needResize=true});
reset();resize();MOT.ang=G.ang;MOT.x=G.x;MOT.y=G.y;requestAnimationFrame(frame);
