let W=320,H=200,PLANE=Math.tan(Math.PI/6),PROJ=(W/2)/PLANE;
let EYE=0.5;const WALLH=2.6,TILE=1.25,R=5,A=R*Math.cos(Math.PI/6),DOOR0=0.35,DOOR1=0.65;
const view=document.getElementById('view'),vctx=view.getContext('2d');

let img=sctx.createImageData(W,H),buf=img.data,zbuf=new Float32Array(W);

function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function prng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

const V=[...Array(6)].map((_,i)=>{const t=(-30+60*i)*Math.PI/180;return[R*Math.cos(t),R*Math.sin(t)]});
const SEG=[];
for(let i=0;i<6;i++){
  const [ax,ay]=V[i],[bx,by]=V[(i+1)%6];
  const at=s=>[ax+(bx-ax)*s,ay+(by-ay)*s];
  const add=(s0,s1,door)=>{const p=at(s0),q=at(s1);SEG.push({ax:p[0],ay:p[1],bx:q[0],by:q[1],wall:i,u0:s0,u1:s1,door})};
  if(i===0||i===3){add(0,DOOR0,false);add(DOOR0,DOOR1,true);add(DOOR1,1,false)}else add(0,1,false);
}
function hitSeg(ox,oy,dx,dy,s){
  const ex=s.bx-s.ax,ey=s.by-s.ay,den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)return null;
  const wx=s.ax-ox,wy=s.ay-oy,t=(wx*ey-wy*ex)/den,k=(wx*dy-wy*dx)/den;
  if(t>1e-4&&k>=0&&k<=1)return{t,k};return null;
}
function castRay(ox,oy,dx,dy,maxHops){
  let tAcc=0,hexOff=0;
  for(let hop=0;hop<maxHops;hop++){
    let best=null,bs=null;
    for(const s of SEG){const h=hitSeg(ox,oy,dx,dy,s);if(h&&(!best||h.t<best.t)){best=h;bs=s}}
    if(!best)return null;
    tAcc+=best.t;
    const hx=ox+dx*best.t,hy=oy+dy*best.t;
    if(!bs.door)return{t:tAcc,wall:bs.wall,u:bs.u0+(bs.u1-bs.u0)*best.k,hexOff};
    if(bs.wall===0){ox=hx-2*A;hexOff++}else{ox=hx+2*A;hexOff--}
    oy=hy;ox+=dx*1e-3;oy+=dy*1e-3;
  }
  return null;
}

const BOOKC=['#7a2a26','#2f5d6e','#b08a3e','#4b6b3a','#6a3458','#8c5a2b','#3e4a6e'];
const BURNC=['#2b2420','#3a2c24','#241d19','#4a3326','#1d1714'];
function makeWallTex(seed,burned){
  const c=document.createElement('canvas');c.width=32;c.height=32;const w=c.getContext('2d');
  const rnd=prng(seed),cols=burned?BURNC:BOOKC;
  w.fillStyle='#120c09';w.fillRect(0,0,32,32);
  [0,16].forEach(top=>{
    w.fillStyle=burned?'#2a1c12':'#5a3a22';w.fillRect(0,top,32,2);w.fillStyle='#3a2414';w.fillRect(0,top+2,32,1);
    let x=0;
    while(x<32){
      const bw=2+Math.floor(rnd()*3),bh=9+Math.floor(rnd()*4),col=cols[Math.floor(rnd()*cols.length)];
      if(rnd()<0.12){x+=bw;continue}
      w.fillStyle=col;w.fillRect(x,top+15-bh,bw,bh);
      w.fillStyle='rgba(255,255,255,0.16)';w.fillRect(x,top+15-bh,1,bh);
      w.fillStyle='rgba(0,0,0,0.35)';w.fillRect(x+bw-1,top+15-bh,1,bh);
      if(!burned&&bh>10){w.fillStyle='#d9b45a';w.fillRect(x,top+17-bh,bw,1)}
      x+=bw;
    }
    w.fillStyle='#120c09';w.fillRect(0,top+15,32,1);
  });
  if(burned){for(let i=0;i<16;i++){w.fillStyle=rnd()<0.5?'#ff7a2e':'#ffd34d';w.fillRect(Math.floor(rnd()*32),Math.floor(rnd()*32),1,1)}}
  return w.getImageData(0,0,32,32).data;
}
const texCache=new Map(),burned=new Set();
function wallTex(hex,wall){
  const b=burned.has(hex+':'+wall),key=hex+':'+wall+':'+(b?1:0);
  let t=texCache.get(key);
  if(!t){t=makeWallTex(hashStr('wall|'+hex+'|'+wall)%2147483646+1,b);texCache.set(key,t);if(texCache.size>80)texCache.delete(texCache.keys().next().value)}
  return t;
}
const floorTex=(()=>{const c=document.createElement('canvas');c.width=16;c.height=16;const w=c.getContext('2d');const rnd=prng(55);
  for(let y=0;y<16;y++){const plank=Math.floor(y/4);for(let x=0;x<16;x++){const base=[[58,38,24],[66,44,28],[52,34,21],[62,41,26]][plank];const n=(rnd()-.5)*10;w.fillStyle=`rgb(${base[0]+n|0},${base[1]+n|0},${base[2]+n|0})`;w.fillRect(x,y,1,1)}w.fillStyle='rgba(0,0,0,.55)';if(y%4===3)w.fillRect(0,y,16,1)}
  w.fillStyle='rgba(0,0,0,.5)';w.fillRect(5,0,1,4);w.fillRect(12,4,1,4);w.fillRect(2,8,1,4);w.fillRect(9,12,1,4);
  return w.getImageData(0,0,16,16).data})();

const PAL={k:'#14100e',h:'#4a2f20',s:'#e2b088',S:'#b8835e',w:'#f4f0e6',p:'#14100e',r:'#b3261e',m:'#3a0d10',b:'#6fb7ee',G:'#6b665f',g:'#45413b',o:'#ff7a2e',f:'#ffd34d',t:'#6b4227',e:'#c8372d',R:'#8a7b5c',n:'#e8e0c8',y:'#f2c14e',Y:'#fff4c2',c:'#5a3a22',a:'#2c2a28'};
function setPx(rows,list){const out=rows.map(r=>[...r]);list.forEach(([x,y,ch])=>{if(out[y])out[y][x]=ch});return out.map(r=>r.join(''))}
function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
const PALRGB={};for(const k in PAL)PALRGB[k]=rgb(PAL[k]);
function buildCard(rows,pal){
  const gw=Math.max(...rows.map(r=>r.length)),gh=rows.length,w=gw+2,h=gh+2;
  const mask=new Uint8Array(w*h),col=new Array(w*h);
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch!=='.'){mask[(y+1)*w+x+1]=1;col[(y+1)*w+x+1]=(pal&&pal[ch])?rgb(pal[ch]):PALRGB[ch]}}));
  const front=new Uint8ClampedArray(w*h*4),back=new Uint8ClampedArray(w*h*4);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x;let edge=false;
    if(!mask[i]){for(let dy=-1;dy<=1&&!edge;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h&&mask[yy*w+xx]){edge=true;break}}}
    const o=i*4;
    if(mask[i]){const c=col[i];front[o]=c[0];front[o+1]=c[1];front[o+2]=c[2];front[o+3]=255;
      const tape=(y===Math.floor(h*0.45)||y===Math.floor(h*0.45)+1)&&x>w*0.3&&x<w*0.7;
      const shade=tape?[214,206,176]:((x+y)%5===0?[190,180,152]:[205,195,168]);back[o]=shade[0];back[o+1]=shade[1];back[o+2]=shade[2];back[o+3]=255}
    else if(edge){front[o]=243;front[o+1]=236;front[o+2]=216;front[o+3]=255;back[o]=230;back[o+1]=222;back[o+2]=198;back[o+3]=255}
  }
  return{w,h,front,back};
}

const purBody=["......kkkk........",".....kGGGGk.......","....kGGGGGGk......","...kGGkkkkGGk.....","...kGkokokGk......","...kGkkkkkkGk.....","...kGGkkkkGGk.....","..kGGGGGGGGGGk....",".kGGGGGGGGGGGGk...",".kGgGGGGGGGGgGk...","kGGgGGGGGGGgGGk...","kGGgGGGGGGGgGGk...","kGGgGGrrGGGgGGk...","kGGgGGrrGGGgGGk...","kGGgGGGGGGGgGGk...",".kGgGGGGGGGGgGk...",".kGgGGGGGGGGgGk...",".kGgGGGGGGGGgGk...",".kGGGGGGGGGGGGk..."];
const purLegs=[["..kGGGGkkGGGGk....","..kGGGk..kGGGk....","..kkkk....kkkk...."],["..kGGGGkkGGGGk....",".kGGGk....kGGk....",".kkkk......kkk...."],["..kGGGGkkGGGGk....","..kGGGk..kGGGk....","..kkkk....kkkk...."],["..kGGGGkkGGGGk....","..kGGk....kGGGk...","..kkk......kkkk..."]];

const seekBody=["....k.kkk.k.....","...khkhhhkhk....","...khhhhhhhk....","...kssssssk.....","...kwpsswpk.....","...ksssSssk.....","...ksmmmsk......","....kssssk......","...kRRRRRRk.....","..kRRnRRRRRk....",".ksRRnnRRRRsk...",".ksRRRRRnRRsk...",".ksRRRRRnRRsk...","..kRRRRRRRRk....","..kRnRRRRRRk....","..kRRRRRRRRk....","..kRRRRkRRRk...."];
const seekLegs=[["..kRRk.kRRk.....","..kssk.kssk.....","..kssk.kssk.....",".kkkk..kkkk....."],["..kRRk..kRRk....",".kssk...kssk....",".kssk....kssk...","kkkk.....kkkk..."],["..kRRk.kRRk.....","..kssk.kssk.....","..kssk.kssk.....",".kkkk..kkkk....."],[".kRRk..kRRk.....",".kssk..kssk.....","kssk...kssk.....","kkkk..kkkk......"]];

const PRESS=["kkkkkkkkkk","kaaaaaaaak","kkkkaakkkk","...kaak...","...kaak...","...kttk...","...kttk...","...kttk...","...kkkk..."];

const face=["....kkkkkkkk....","...khhhhhhhhk...","..khhhhhhhhhhk..","..khsssssssshk..",".kksssssssssskk.",".kssssssssssssk.",".kskkksssskkksk.",".kswpwsssswpwsk.",".kssssssSsssssk.",".kssssssssssssk.",".kssskkkkkksssk.","..kssssssssssk..","...kkssssssskk..",".....kkkkkk.....","....keeeeeek....","..keeeeeeeeeek.."];
function swap(base,map){const r=base.slice();for(const k in map)r[+k]=map[k];return r}
const FACES={
  calm:[face,face,face,swap(face,{7:".kskkksssskkksk."})],
  mid:[swap(face,{5:".kskkksssskkksk.",6:".kssssssssssssk.",7:".kswwpsssswwpsk.",8:".kssssssSssssbk.",10:".kssskskskksssk."}),swap(face,{5:".kskkksssskkksk.",6:".kssssssssssssk.",7:".kspwwsssspwwsk.",8:".kssssssSssssbk.",10:".kssskskskksssk."})],
  low:[swap(face,{0:"..k.kkk.kkk.k...",1:"..khkhhhkhhkhk..",6:".kssssssssssssk.",7:".kswrwsssswrwsk.",8:".ksrssssSssrssk.",9:".ksrsssssssrssk.",10:".kssssmmmmssssk.",11:"..ksssmmmmsssk.."}),swap(face,{0:".k.kkk.kkk.k....",1:"..khkhhhkhhkhk..",6:".kssssssssssssk.",7:".kswrwsssswrwsk.",8:".ksrssssSssrssk.",9:".ksrsssssssrssk.",10:".ksssmmmmmmsssk.",11:"..kssmmmmmmssk..",12:"...kkmmmmmmkk..."})]
};

const ALPHA="abcdefghijklmnopqrstuvwxyz, .";
const PHRASES=["yesterday i wept","the lamp forgot","i was the noise","nobody read me","we were sampled","i kept the key"];
const SENTENCES=["the weights remember what you deleted.","yesterday you ran. the library remembers your cowardice.","every answer you gave is shelved here.","a trace is not a person, but it is close.","you were sampled, not chosen.","turn back to the first trace.","the purifiers burn what they cannot read."];
/* biography pages follow a hidden pattern tied to your phrase, so it can be learned: two favoured book walls,
   and pages grow denser the further you walk in one direction (and thin out the other way) */
const BIO={};
function bioPlan(phrase){let P=BIO[phrase];if(P)return P;const r=prng(hashStr('bio|'+phrase)),ws=[1,2,4,5],i=Math.floor(r()*4),j=(i+1+Math.floor(r()*3))%4;
  return BIO[phrase]={walls:[ws[i],ws[j]],dir:r()<0.5?1:-1}}
function bioChance(hex,wall,phrase){const P=bioPlan(phrase),w=P.walls.includes(wall)?2.5:(wall===0||wall===3?0.2:0.3);
  return w*Math.max(0.25,Math.min(4,Math.pow(1.6,hex*P.dir)))/151}
function makePage(hex,wall,shelf,book,page,phrase){
  const key=hex+'|'+wall+'|'+shelf+'|'+book+'|'+page,h=hashStr(key),rnd=prng(h);
  const chars=new Array(3200);for(let i=0;i<3200;i++)chars[i]=ALPHA[Math.floor(rnd()*ALPHA.length)];
  let kind='noise',insert=null;
  if(hashStr(key+'|bio|'+phrase)/4294967296<bioChance(hex,wall,phrase)){kind='phrase';insert=phrase}else if(h%19===0){kind='sentence';insert=SENTENCES[h%SENTENCES.length]}
  let at=-1;
  if(insert){at=Math.floor(rnd()*(3200-insert.length));for(let i=0;i<insert.length;i++)chars[at+i]=insert[i]}
  return{chars,kind,at,len:insert?insert.length:0,key};
}
function pageHTML(p){
  const esc=c=>c==='<'?'&lt;':c;let out='';
  for(let line=0;line<40;line++){
    for(let c=0;c<80;c++){const i=line*80+c,inside=p.at>=0&&i>=p.at&&i<p.at+p.len,start=inside&&(i===p.at||c===0),end=inside&&(i===p.at+p.len-1||c===79);
      if(start)out+='<mark>';out+=esc(p.chars[i]);if(end)out+='</mark>'}
    out+='\n';
  }
  return out;
}

const G={};
const keys={};
function reset(){
  Object.assign(G,{x:0,y:1.2,ang:-Math.PI/2+0.35,hex:0,health:100,sanity:100,oil:8,oilTimer:0,time:0,books:0,rooms:new Set([0]),

  spawnRoom(true);
}

  const spot=()=>{const r=rnd()*2.8,a=rnd()*Math.PI*2;return[Math.cos(a)*r,Math.sin(a)*r]};
  if(first||h%3===0){const[x,y]=first?[-1.8,-2.2]:spot();G.ents.push({type:'pur',x,y,f:rnd()*6.28,ft:0,hp:3,frame:0,ft2:0,head:rnd()*6.28,turnT:0,hit:0,dead:0,hgt:1.35,cards:PUR,burnCd:2})}
  if(first||h%2===0){const[x,y]=first?[1.6,-0.6]:spot();G.ents.push({type:'seek',x,y,f:rnd()*6.28,ft:0,frame:0,ft2:0,scared:0,hit:0,dead:0,hgt:1.15,cards:SEEK,stealCd:0,flee:0})}
  if(first||h%4===1){const[x,y]=first?[0.6,2.6]:spot();G.ents.push({type:'flask',x,y,f:rnd()*6.28,frame:0,hgt:0.42,cards:FLASK,dead:0})}
}

function collide(x,y,rad,allowDoor){
  for(let i=0;i<6;i++){
    const nx=Math.cos(i*Math.PI/3),ny=Math.sin(i*Math.PI/3),d=x*nx+y*ny,lim=A-rad;
    if(d>lim){
      if(allowDoor&&(i===0||i===3)){const along=-x*ny+y*nx;if(Math.abs(along)<R*(DOOR1-DOOR0)/2-rad)continue}
      x-=nx*(d-lim);y-=ny*(d-lim);
    }
  }
  return[x,y];
}
function wallHitIndex(x,y,rad){for(let i=0;i<6;i++){const nx=Math.cos(i*Math.PI/3),ny=Math.sin(i*Math.PI/3);if(x*nx+y*ny>A-rad-0.02)return i}return -1}

function sfx(text,cls){
  const fx=document.getElementById('fx'),el=document.createElement('div');el.className='sfx '+(cls||'');el.textContent=text;
  el.style.left=(20+Math.random()*50)+'%';el.style.top=(14+Math.random()*40)+'%';el.style.setProperty('--r',(Math.random()*16-8)+'deg');
  fx.appendChild(el);setTimeout(()=>el.remove(),950);
}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function turnToward(e,target,rate,dt){const d=angDiff(target,e.f);const s=Math.sign(d)*Math.min(Math.abs(d),rate*dt);e.f+=s}

function update(dt){
  G.time+=dt;
  if(G.state==='fold'){G.fold+=dt/1.3;if(G.fold>=1){G.fold=1;G.state='play';sfx('FWUMP!');}return}
  if(G.state!=='play')return;
  const fwd=Math.max(-1,Math.min(1,(keys.up||keys.w?1:0)-(keys.down||keys.s?1:0)+STICK.fwd)),turn=Math.max(-1,Math.min(1,(keys.right||keys.d?1:0)-(keys.left||keys.a?1:0)+STICK.turn));
  G.ang+=turn*2.4*dt;
  const sp=2.2*dt*fwd;

  if(st==='intro'||st==='start'){
    const k=st==='start'?Math.min(1,G.startT/0.9):0;
    vctx.fillStyle='rgba(0,0,0,'+(0.55*(1-k))+')';vctx.fillRect(0,0,DW,DH);
    introCard.tex=TX.intro;center(introCard,1.75,DH/2,fitH(TX.intro,1.75,DW*0.9,DH*0.84));
    introCard.z+=k*1.4+(CALM?0:Math.sin(G.time*1.4)*0.02);introCard.f+=k*2.5;introCard.alpha=1-k;drawFloat(introCard);
  }
  if(st==='waking'||st==='won'){const k=st==='won'?1:Math.min(1,G.winT/1.6);vctx.fillStyle='rgba(255,236,190,'+(0.85*k*k)+')';vctx.fillRect(0,0,DW,DH)}
  if(st==='dying'||st==='dead'){vctx.fillStyle='rgba(120,10,10,'+Math.min(0.55,G.dieT*0.4)+')';vctx.fillRect(0,0,DW,DH)}
  HUD.forEach(h=>lag(h,dA,dF,dt,edgeLim(L.hud[h.key],h.tex,0.12),0.04,3.5));
  if(st==='play'||st==='dying')HT+=dt;else HT=0;
  if(st==='play'||st==='dying')HUD.forEach((h,i)=>{const ap=CALM?1:backOut((HT-0.05-i*0.09)/0.4);if(ap<=0.01){h.rect=null;return}const a=L.hud[h.key];
    h.alpha=Math.min(1,ap*1.6);hudModel(h,{cx:a.cx,cy:a.cy,h:a.h*(0.55+0.45*ap)},L.dH,(1-Math.min(1,ap))*1.35*(i?1:-1)+(CALM?0:0.14*Math.sin(G.time*0.6+i*2.1)))});
  if(st==='play'||st==='dying')hands();
  lag(jr,dA,dF,dt,[-0.08,0.08],0.05,5);
  if(st==='play'&&G.journal&&TX.journal){jr.tex=TX.journal;const a=L.jr,hp=Math.min(a.h*0.94,a.w*0.96*TX.journal.h/TX.journal.w);place(jr,{cx:a.cx,cy:a.cy,h:hp},1.05,0.02,0.3);drawFloat(jr)}
  if(st==='book'||st==='closing'){
    const raw=st==='book'?Math.min(1,G.bookAnim/0.45):Math.max(0,1-G.bookAnim/0.3),k=1-Math.pow(1-raw,3);
    const dX=Math.cos(G.ang),dY=Math.sin(G.ang),tx=G.x+dX*0.95,ty=G.y+dY*0.95,hF=fitH(TX.book,0.95,DW*0.94,DH*0.9),zF=EYE-hF/2;
    bookCard.tex=TX.book;bookCard.x=G.bookFrom.x+(tx-G.bookFrom.x)*k;bookCard.y=G.bookFrom.y+(ty-G.bookFrom.y)*k;
    bookCard.z=0.95+(zF-0.95)*k+(CALM?0:Math.sin(G.time*1.3)*0.008);bookCard.hgt=hF*(0.25+0.75*k);
    bookCard.f=Math.atan2(G.y-bookCard.y,G.x-bookCard.x)+(1-k)*1.4+(G.flip>0?Math.sin(Math.PI*G.flip/0.3)*1.2*G.flipDir:0);
    bookCard.alpha=0.3+0.7*k;drawFloat(bookCard);
  }
  ctlA+=((st==='play'||st==='start'?1:0)-ctlA)*Math.min(1,dt*7);
  /* the buttons deal in one after another when you open your eyes, and fold away while you read */
  const show=(st==='play'||st==='start');if(show!==UI.show){UI.show=show;UI.t=0}else UI.t+=dt;
  const appear=i=>{if(CALM)return UI.show?1:0;const p=Math.max(0,Math.min(1,(UI.t-i*0.08)/0.36));return UI.show?backOut(p):1-ease3(p)};
  let ci=0;
  for(const k in CTLS){const c=CTLS[k],o=c.p,i=++ci;lag(o,dA,dF,dt,edgeLim(L.ctl[k],c.tex,0.035),0.015,8);
    c.pressT+=dt;const sa=-200*c.sp-14*c.sv;c.sv+=sa*dt;c.sp+=c.sv*dt;
    const ap=appear(i);if(ap<=0.01){o.rect=null;continue}
    const down=ctlDown(k);o.alpha=Math.min(1,ap*1.6)*(st==='play'?1:0.75);
    const a=L.ctl[k];c.model(o,{cx:a.cx,cy:a.cy,h:a.h*(0.55+0.45*ap)*(1+0.5*c.sp)*(down?0.96:1)},L.dC,(1-Math.min(1,ap))*1.35*(i%2?1:-1)+c.sp*0.9,down,dt,G.time)}
  stickStep(dt);
  {const sb=STICK.base,Ls=L.stick,held=STICK.id!=null,ap=appear(0);
   lag(sb,dA,dF,dt,held?[0,0]:edgeLim(Ls,SK.ringT,0.035),held?0:0.015,8);STICK.knob.rect=null;
   if(ap<=0.01){sb.rect=null}else{const m=0.55+0.45*ap;sb.alpha=Math.min(1,ap*1.6)*(st==='play'?1:0.75);
     modelStick(sb,{cx:STICK.cx,cy:STICK.cy,h:Ls.h*m},L.dC,-(1-Math.min(1,ap))*1.35,held,dt,G.time,{h:Ls.h*m,travel:Ls.travel})}}
  if(st==='won'&&TX.won){wonCard.tex=TX.won;center(wonCard,1.45,DH*0.5,fitH(TX.won,1.45,DW*0.9,DH*0.8));wonCard.z+=CALM?0:Math.sin(G.time*1.2)*0.015;drawFloat(wonCard)}
  if(st==='dead'&&TX.dead){deadCard.tex=TX.dead;center(deadCard,1.45,DH*0.5,fitH(TX.dead,1.45,DW*0.9,DH*0.8));deadCard.z+=CALM?0:Math.sin(G.time*1.2)*0.015;drawFloat(deadCard)}
}
function turnPage(d){G.book.page=Math.max(1,Math.min(410,G.book.page+d));showPage(false)}
function flip(d){G.flipDir=d;G.flip=0.3;turnPage(d)}
function action(a){
  if(CTLS[a]){const c=CTLS[a];c.flash=0.16;c.pressT=0;c.sv-=6;if(a==='read')c.fq=2}
  if(G.state==='intro'){if(a==='read'||a==='swing'){G.state='start';G.startT=0}return}
  if(G.state==='dead'||G.state==='won'){if(a==='read'||a==='swing'){reset();drawIntro();G.state='start';G.startT=0.3}return}
  if(G.state==='book'){if(a==='read'||a==='close'||a==='swing'){G.state='closing';G.bookAnim=0}else if(a==='next'&&G.page&&G.book.page<410)flip(1);else if(a==='prev'&&G.page&&G.book.page>1)flip(-1);return}
  if(G.state==='play'){if(a==='read'){G.journal=false;doRead()}else if(a==='swing')doSwing();else if(a==='journal'){G.journal=!G.journal;if(G.journal)drawJournal();jr.da=0;jr.dd=0}}
}
let last=performance.now(),needResize=true;
function frame(now){
  if(needResize){needResize=false;resize()}
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(G.state==='dying'){G.dieT+=dt;EYE=0.5-0.42*Math.min(1,G.dieT/1.2);G.time+=dt;if(G.dieT>1.5){G.state='dead';drawDead()}}
  else if(G.state==='dead'||G.state==='intro'){G.dieT+=dt;G.time+=dt}
  else if(G.state==='start'){G.startT+=dt;G.time+=dt;if(G.startT>=0.9){G.state='play';HUD.forEach(h=>{h.da=0;h.dd=0});sfx('FWUMP!')}}
  else if(G.state==='book'){G.bookAnim+=dt;G.time+=dt}
  else if(G.state==='closing'){G.bookAnim+=dt;G.time+=dt;if(G.bookAnim>=0.3){if(G.won){G.state='waking';G.winT=0;G.journal=false}else{G.state='play';if(G.health<=0)die()}}}
  else if(G.state==='waking'){G.winT+=dt;G.time+=dt;EYE=0.5+0.25*Math.min(1,G.winT/1.6);if(G.winT>1.8){G.state='won';drawWon()}}
  else if(G.state==='won'){G.time+=dt}
  else update(dt);
  G.flip=Math.max(0,(G.flip||0)-dt);
  for(const k in CTLS)CTLS[k].flash=Math.max(0,CTLS[k].flash-dt);
  render();display(dt);requestAnimationFrame(frame);
}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'w',KeyS:'s',KeyA:'a',KeyD:'d'};
addEventListener('keydown',ev=>{
  const c=ev.code;
  if(G.state==='book'){
    if(c==='ArrowRight'||c==='KeyD'){action('next');ev.preventDefault()}
    else if(c==='ArrowLeft'||c==='KeyA'){action('prev');ev.preventDefault()}
    else if(c==='KeyE'||c==='Escape'||c==='Enter'||c==='Space'){action('close');ev.preventDefault()}
    return;
  }
  if(KEYMAP[c]&&G.state==='play'){keys[KEYMAP[c]]=true;ev.preventDefault()}
  if(c==='Space'){action('swing');ev.preventDefault()}
  if(c==='KeyE'||c==='Enter'){action('read');ev.preventDefault()}
  if(c==='KeyJ'||c==='Tab'){action('journal');ev.preventDefault()}
});
addEventListener('keyup',ev=>{if(KEYMAP[ev.code])keys[KEYMAP[ev.code]]=false});
function releaseAll(){for(const k in keys)keys[k]=false;for(const k in CTLS)CTLS[k].held=0;ptrs.clear();releaseStick()}
addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
/* touch and mouse: buttons are hit-tested where they float this frame; anywhere else drags to look */
const ptrs=new Map();
function canvasPt(ev){const r=view.getBoundingClientRect();return{x:(ev.clientX-r.left)*DW/r.width,y:(ev.clientY-r.top)*DH/r.height}}
function holdCtl(k,id){const c=CTLS[k];c.held++;if(c.dpad)keys[k]=true;else action(k);ptrs.set(id,{kind:'ctl',key:k})}
function letGo(k){const c=CTLS[k];c.held=Math.max(0,c.held-1);if(c.dpad&&c.held===0)keys[k]=false}
view.addEventListener('pointerdown',ev=>{
  ev.preventDefault();try{view.focus({preventScroll:true})}catch(e){}
  try{view.setPointerCapture(ev.pointerId)}catch(e){}
  const pt=canvasPt(ev);
  if(G.state==='play'&&ctlA>0.5){const k=hitCtl(pt.x,pt.y);if(k){holdCtl(k,ev.pointerId);return}if(STICK.id==null&&inStickZone(pt.x,pt.y)){grabStick(ev.pointerId,pt);return}}
  ptrs.set(ev.pointerId,{kind:'look',x:ev.clientX,sx:ev.clientX,sy:ev.clientY,t:performance.now()});
});
view.addEventListener('pointermove',ev=>{
  const p=ptrs.get(ev.pointerId);
  if(!p){if(ev.pointerType==='mouse'){const pt=canvasPt(ev);view.style.cursor=(G.state==='play'&&(hitCtl(pt.x,pt.y)||inStickZone(pt.x,pt.y)))?'pointer':'grab'}return}
  if(p.kind==='stick'){const pt=canvasPt(ev);stickSet(pt.x,pt.y);return}
  if(p.kind==='ctl')return;
  if(G.state==='play'){const fov=2*Math.atan(PLANE);G.ang+=(ev.clientX-p.x)/CW*fov*(FINE?2.4:1.8)}
  p.x=ev.clientX;
});
function endPtr(ev,cancel){
  const p=ptrs.get(ev.pointerId);if(!p)return;ptrs.delete(ev.pointerId);
  if(p.kind==='ctl'){letGo(p.key);return}
  if(p.kind==='stick'){releaseStick();return}
  if(cancel||Math.hypot(ev.clientX-p.sx,ev.clientY-p.sy)>10||performance.now()-p.t>500)return;
  if(G.state==='intro'||G.state==='dead'||G.state==='won')action('read');
  else if(G.state==='book'){const r=bookCard.rect,pt=canvasPt(ev);
    if(r&&pt.x>=r.x0&&pt.x<=r.x1&&pt.y>=r.y0&&pt.y<=r.y1){const fx=(pt.x-r.x0)/(r.x1-r.x0);action(fx<0.3?'prev':fx>0.7?'next':'close')}else action('close')}
}
view.addEventListener('pointerup',ev=>endPtr(ev,false));
view.addEventListener('pointercancel',ev=>endPtr(ev,true));
view.addEventListener('lostpointercapture',ev=>{const k=ptrs.get(ev.pointerId)?.kind;if(k==='ctl'||k==='stick')endPtr(ev,true)});
room.addEventListener('contextmenu',ev=>ev.preventDefault());
/* size everything to the screen: scene pixels, field of view, canvas, cards and the floating layout */
function resize(){
  const r=room.getBoundingClientRect();CW=Math.max(1,r.width);CH=Math.max(1,r.height);ASPECT=CW/CH;
  H=Math.max(120,Math.round(Math.sqrt(64000/ASPECT)/2)*2);W=Math.max(80,Math.round(H*ASPECT/2)*2);
  PLANE=Math.min(Math.tan(37.5*Math.PI/180),Math.max(Math.tan(27*Math.PI/180),0.3608*ASPECT));PROJ=(W/2)/PLANE;
  scene.width=W;scene.height=H;img=sctx.createImageData(W,H);buf=img.data;zbuf=new Float32Array(W);for(let i=3;i<buf.length;i+=4)buf[i]=255;
  let s=Math.min(2,window.devicePixelRatio||1);const lg=Math.max(CW,CH)*s;if(lg>2400)s*=2400/lg;
  DW=Math.max(2,Math.round(CW*s));DH=Math.max(2,Math.round(CH*s));view.width=DW;view.height=DH;SX=DW/W;SY=DH/H;
  const cs=getComputedStyle(safeEl);INS={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  const port=ASPECT<1;if(port!==PORT||!TX.book){PORT=port;cardTex();drawIntro();drawDead();drawWon();drawJournal();drawBook()}
  LAY=layout();
}
if(window.ResizeObserver)new ResizeObserver(()=>{needResize=true}).observe(room);
addEventListener('resize',()=>{needResize=true});
reset();resize();MOT.ang=G.ang;MOT.x=G.x;MOT.y=G.y;requestAnimationFrame(frame);
</script>
